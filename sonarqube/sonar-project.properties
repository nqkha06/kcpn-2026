sonar.projectKey=cashback
sonar.projectName=Cashback
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

sonar.sources=backend/app,backend/routes,backend/config,backend/database,frontend/src,codeceptjs
sonar.tests=backend/tests,frontend/src,codeceptjs/tests

sonar.exclusions=\
  backend/tests/**,\
  backend/vendor/**,\
  backend/node_modules/**,\
  backend/public/build/**,\
  backend/public/hot,\
  backend/storage/**,\
  backend/bootstrap/cache/**,\
  backend/resources/js/actions/**,\
  backend/resources/js/routes/**,\
  backend/resources/js/wayfinder/**,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx,\
  frontend/src/**/*.spec.ts,\
  frontend/src/**/*.spec.tsx,\
  frontend/node_modules/**,\
  frontend/.next/**,\
  frontend/coverage/**,\
  codeceptjs/tests/**,\
  codeceptjs/node_modules/**,\
  codeceptjs/tests.zip,\
  **/.env,\
  **/.env.*,\
  **/.DS_Store,\
  **/*.min.js,\
  **/*.sqlite

sonar.test.inclusions=\
  backend/tests/**/*.php,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx,\
  frontend/src/**/*.spec.ts,\
  frontend/src/**/*.spec.tsx,\
  codeceptjs/tests/**/*.js

sonar.coverage.exclusions=\
  backend/config/**,\
  backend/database/**,\
  backend/routes/**,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx,\
  frontend/src/**/*.spec.ts,\
  frontend/src/**/*.spec.tsx,\
  codeceptjs/**

sonar.cpd.exclusions=\
  backend/database/migrations/**,\
  backend/tests/**,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx,\
  codeceptjs/tests/**

sonar.php.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.working.directory=/tmp/.scannerwork
